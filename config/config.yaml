# Equity Screening & Valuation Factors - pipeline configuration
# Paths are relative to the repository root.

project:
  db_path: data/equity_screener.db
  raw_dir: data_raw
  output_dir: outputs
  log_dir: logs

# `--mode demo` overrides these so synthetic test data never touches the live database.
demo:
  db_path: data/demo_synthetic.db
  output_dir: outputs/demo_synthetic
  seed: 7
  n_tickers: 150

universe:
  source: sp500_wikipedia        # sp500_wikipedia | file
  file: data_raw/sample_universe.csv
  max_tickers: null              # e.g. 50 for a quick live run inside free-tier API limits
  point_in_time_membership: true # with sp500_wikipedia: only score stocks in months they were index members,
                                 # using membership rebuilt from Wikipedia's dated change table

prices:
  source: yfinance
  start: "2005-01-01"
  benchmark: SPY
  batch_size: 100
  include_partial_month: false   # drop the in-progress month so every bar is a completed month-end

fundamentals:
  source: yfinance               # yfinance | fmp | alphavantage | sec
  filing_lag_days: 90            # used when the provider gives no filing date
  max_staleness_months: 18       # ignore a statement whose fiscal period ended longer ago than this
  # Restate as-reported shares/EPS onto the split-adjusted price basis. Per source, because a
  # provider that already restates history for splits must NOT be adjusted again. Check with
  # tests/test_live.py (see README) and the share_count_discontinuity quality check.
  split_adjust:
    sec: true                    # SEC facts are as filed
    fmp: true
    alphavantage: true
    yfinance: true
    synthetic: true
  cache_days: 25                 # reuse cached per-ticker downloads younger than this
  max_requests_per_run: null     # cap on HTTP requests per run, retries included (set low for free tiers)
  request_pause_seconds: 0.25
  fmp_base_url: https://financialmodelingprep.com/stable
  fmp_limit: 10
  sec_user_agent: "Your Name your.email@example.com"   # SEC requires a real contact string

factors:
  winsorize: [0.01, 0.99]
  sector_neutral: true
  min_names_per_date: 30
  min_value_subfactors: 2
  ev_excluded_sectors: [Financials]   # EV-based multiples are not meaningful for banks/insurers
  ev_missing_policy: exclude     # exclude: no EV factors when debt or cash is missing (a missing fact is
                                 # not a zero); assume_zero: treat missing debt/cash as 0 (old behaviour)
  weights:
    value: 0.5
    momentum: 0.5
    quality: 0.0
    earnings_quality: 0.0        # low accruals; reported as a diagnostic, off in the composite

screen:
  # Mechanical screening labels, not investment recommendations
  candidate_quantile: 0.90       # above this percentile: "Research candidate"
  lower_priority_quantile: 0.10  # at or below: "Lower priority"; in between: "Neutral"
  rule_based:
    exclude_sectors: [Financials]
    require_positive_momentum: true
    top_n: 50

backtest:
  top_quantile: 0.90
  min_holdings: 10
  holding_months: [1, 6, 12]     # first entry is the headline strategy
  cost_bps: 10                   # charged on traded weight at each rebalance
  execution_lag_months: 1        # 1 (headline): trade one month after the signal month-end.
                                 # 0: trade at the signal close, the optimistic academic convention.
                                 # The other convention is always reported alongside.
  risk_free_annual: 0.0
  forward_horizons: [1, 6, 12]

model:
  label_horizon_months: 12
  n_splits: 5
  gap_months: 12                 # purge gap = label horizon, so train labels never overlap test dates
  min_train_dates: 24
  logistic_C: 1.0
  ridge_alpha: 10.0

research:
  peers: 6                       # nearest-market-cap peers in the same sector shown in research reports
  contemporaneous_days: 45       # analyst work dated more than this many days after the report month-end
                                 # is labelled retrospective (written with hindsight)
  # Mechanical screening flags in research reports. The thresholds are this project's choices
  # for drawing attention, not industry standards; adjust to your own judgment.
  flags:
    min_cash_conversion: 0.8     # OCF / net income below this in 2 of the last 3 years
    high_accruals_percentile: 0.8  # accruals ratio in the top 20% of the universe that month
    fcf_decline_years: 3         # FCF fell in each of the last N years
    max_net_debt_to_ebitda: 3.0
    max_terminal_share: 0.75     # DCF terminal value above this share of EV
    max_dcf_gap: 0.5             # DCF base value more than 50% above or below the price
    max_drawdown_36m: -0.30
    high_beta: 1.3

logging:
  console: summary               # summary: one line per stage + results; verbose: full log on screen
                                 # (the file logs/pipeline.log always has the full log)

report:
  inline_plotlyjs: false        # true embeds plotly.js (~4.5 MB) so the report works offline

quality:
  min_universe_size: 20
  min_price_coverage: 0.90
  min_fundamental_coverage: 0.70
  min_ev_input_coverage: 0.80    # warn if fewer statements report both debt and cash
  max_price_staleness_days: 45
  max_stale_ticker_share: 0.10   # warn if more than this share of the universe stops before the latest month
  extreme_monthly_return: 3.0
  fail_on_error: true
