# Offline CI: the full test suite and the synthetic demo on Linux / Python 3.12 with the pinned
# versions from requirements-tested.txt, plus a Docker build-and-run. No network data is used.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-tested.txt
          python -m pip install --no-deps -e .
      - name: Test suite (live checks skip without EQSCREEN_LIVE)
        run: python -m pytest -rs
      - name: Synthetic demo and validation report
        run: |
          python -m eqscreen.pipeline --mode demo
          python -m eqscreen.validate --mode demo
      - name: Upload demo outputs (synthetic)
        uses: actions/upload-artifact@v4
        with:
          name: demo-outputs-synthetic
          path: |
            outputs/demo_synthetic/report.html
            outputs/demo_synthetic/validation/
            logs/pipeline.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t eqscreen .
      - name: Run the demo in the container
        run: docker run --rm eqscreen
      - name: Run the tests in the container
        run: docker run --rm --entrypoint python eqscreen -m pytest -q
